<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="/css/assets/pumpkin-logo.png" type="image/png" />
    <title>Profile</title>
  </head>

  <body>
    <!-- Header Section -->
    <header>
      <a href="./index.html">
        <h1>Welcome to the Loser's League</h1>
        <img
          src="css/assets/pumpkin-logo.png"
          alt="Cartoon logo of Football Player"
          class="logo"
        />
      </a>
    </header>

    <!-- Main Content -->
    <main id="adminView">
      <section class="container my-4" aria-labelledby="weeklyLifecycleHeading">
        <h2 id="weeklyLifecycleHeading">Weekly lifecycle</h2>
        <form id="officialResultForm" class="row g-2 mb-4">
          <h3 class="h5">Official game result override</h3>
          <div class="col-md-3"><label class="form-label" for="overrideHomeTeam">Home Team</label><input class="form-control" id="overrideHomeTeam" required /></div>
          <div class="col-md-3"><label class="form-label" for="overrideAwayTeam">Away Team</label><input class="form-control" id="overrideAwayTeam" required /></div>
          <div class="col-md-2"><label class="form-label" for="overrideHomeScore">Home score</label><input class="form-control" id="overrideHomeScore" type="number" min="0" required /></div>
          <div class="col-md-2"><label class="form-label" for="overrideAwayScore">Away score</label><input class="form-control" id="overrideAwayScore" type="number" min="0" required /></div>
          <div class="col-12"><label class="form-label" for="overrideExplanation">Explanation</label><input class="form-control" id="overrideExplanation" maxlength="500" required /></div>
          <div class="col-12"><label class="form-label" for="overrideSourceUrl">Source URL (optional)</label><input class="form-control" id="overrideSourceUrl" type="url" maxlength="2048" /></div>
          <div class="col-12"><button class="btn btn-warning" type="submit">Preview official result</button></div>
        </form>
        <form id="manualCloseForm" class="row g-2 mb-3">
          <h3 class="h5">Manual week advancement</h3>
          <div class="col-12"><label class="form-label" for="manualCloseNote">Reason for manual closure</label><input class="form-control" id="manualCloseNote" maxlength="500" required /></div>
          <div class="col-12"><button class="btn btn-danger" type="submit">Preview and close current week</button></div>
        </form>
        <p id="weeklyLifecycleStatus" role="status" aria-live="polite"></p>
      </section>
      <section id="adminUsers"></section>
    </main>
    <button
      id="logoutBtn"
      class="btn btn-outline-primary testerBtn"
    >
      Logout
    </button>

    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./js/pages/admin.js"></script>
  </body>
</html>

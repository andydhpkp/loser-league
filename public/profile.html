<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="/css/assets/pumpkin-logo.png" type="image/png" />
    <title>Profile</title>
  </head>

  <body>
    <!-- Header Section -->
    <header>
      <a href="./index.html">
        <h1>Welcome to the Loser's League</h1>
        <img
          src="css/assets/pumpkin-logo.png"
          alt="Cartoon logo of Football Player"
          class="logo"
        />
      </a>
    </header>

    <!-- Main Content -->
    <main id="games">
      <h1 id="loading">Please Wait for Teams to Load</h1>
      <section id="gameMatchups"></section>

      <div id="trackActions" class="track-actions">
        <!-- Submit Picks will be injected here -->
        <button
          id="logoutBtn"
          class="btn btn-outline-primary"
        >
          Logout
        </button>
      </div>
    </main>

    <div class="modal fade" id="pickReviewModal" tabindex="-1" aria-labelledby="pickReviewTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h2 class="modal-title fs-5" id="pickReviewTitle">Review and submit all Picks</h2></div>
        <div class="modal-body">
          <ul id="pickReviewList"></ul>
          <p><strong>Are you sure? You will not be able to change your Picks after submitting.</strong></p>
          <p id="pickReviewError" class="text-danger" role="alert" hidden></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Go back and edit</button>
          <button type="button" class="btn btn-primary" id="confirmPickSubmission">Submit and lock Picks</button>
        </div>
      </div></div>
    </div>

    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./js/pages/profile.js"></script>
  </body>
</html>

name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Complete test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: loser_league_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql://root:test-password@127.0.0.1:3306/loser_league_ci_test
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Run unit coverage gate
        run: npm run test:unit:coverage

      - name: Lint browser modules
        run: npm run lint:browser

      - name: Run MySQL integration tests
        run: npm run test:integration

      - name: Run browser smoke tests
        run: npm run test:smoke

  deploy:
    name: Deploy tested commit to Heroku
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: loser-league-production
      cancel-in-progress: false
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Confirm commit is still current main
        id: freshness
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment for $GITHUB_SHA"
          fi

      - name: Set up Node.js
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Heroku CLI
        if: steps.freshness.outputs.deploy == 'true'
        run: npm install --global heroku@11.8.1

      - name: Configure Heroku Git remote
        if: steps.freshness.outputs.deploy == 'true'
        run: heroku git:remote --app "$HEROKU_APP_NAME"

      - name: Capture current Heroku release
        if: steps.freshness.outputs.deploy == 'true'
        id: prior_release
        run: |
          remote_sha="$(git ls-remote heroku refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_sha" ]; then
            echo "Unable to resolve the Heroku main commit" >&2
            exit 1
          fi
          release_version="$(heroku releases --json --app "$HEROKU_APP_NAME" | jq -r '.[0].version // empty')"
          if [ -z "$release_version" ]; then
            echo "Unable to resolve the current Heroku release" >&2
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            echo "Heroku already contains tested commit $GITHUB_SHA"
          else
            echo "already_deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy tested commit
        if: steps.freshness.outputs.deploy == 'true' && steps.prior_release.outputs.already_deployed != 'true'
        run: git push heroku "$GITHUB_SHA:refs/heads/main"

      - name: Verify Heroku release succeeded
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          if [ "${{ steps.prior_release.outputs.already_deployed }}" = true ]; then
            release_json="$(heroku releases --json --app "$HEROKU_APP_NAME")"
            deploy_description="Deploy ${GITHUB_SHA:0:8}"
            release_version="$(jq -r --arg description "$deploy_description" \
              '[.[] | select(.description == $description)][0].version // empty' \
              <<< "$release_json")"
            release_status="$(jq -r --arg description "$deploy_description" \
              '[.[] | select(.description == $description)][0].status // empty' \
              <<< "$release_json")"
            if [ -n "$release_version" ] && [ "$release_status" = succeeded ]; then
              echo "Existing Heroku release $release_version is succeeded"
              exit 0
            fi
            echo "Existing Heroku release status is $release_status, expected succeeded" >&2
            exit 1
          fi

          release_status="pending"
          for attempt in {1..12}; do
            release_json="$(heroku releases --json --app "$HEROKU_APP_NAME")"
            release_version="$(jq -r '.[0].version // empty' <<< "$release_json")"
            release_status="$(jq -r '.[0].status // empty' <<< "$release_json")"
            if [ -n "$release_version" ] && \
              [ "$release_version" != "${{ steps.prior_release.outputs.version }}" ]; then
              if [ "$release_status" = "succeeded" ]; then
                exit 0
              fi
              if [ "$release_status" = "failed" ]; then
                break
              fi
            fi
            sleep 5
          done
          echo "Heroku release status is $release_status, expected succeeded" >&2
          exit 1

      - name: Verify production health
        if: steps.freshness.outputs.deploy == 'true'
        env:
          PRODUCTION_ORIGIN: https://${{ vars.HEROKU_APP_NAME }}.herokuapp.com
        run: |
          check_health() {
            path="$1"
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --max-time 10 \
                "$PRODUCTION_ORIGIN$path" > /dev/null; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          if ! check_health "/"; then
            echo "Production health check failed for /; no automatic restart attempted" >&2
            exit 1
          fi

          if check_health "/api/nfl/teams"; then
            exit 0
          fi

          echo "Upstream health check failed; restarting the web process type once" >&2
          heroku ps:restart --process-type web --app "$HEROKU_APP_NAME"

          if ! check_health "/"; then
            echo "Production health check failed for / after web process restart" >&2
            exit 1
          fi
          if ! check_health "/api/nfl/teams"; then
            echo "Upstream health check failed after one web process restart" >&2
            exit 1
          fi
          echo "Production health recovered after one web process restart"
